x-backend: &backend
  build: ./backend
  env_file:
    - backend/.env
  environment:
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    REDIS_REQUIRED: "true"
    DJANGO_ALLOWED_HOSTS: "${APP_HOSTS:-localhost,127.0.0.1},127.0.0.1"
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    FRONTEND_URL: ${APP_ORIGIN:-http://localhost:8080}
    FRONTEND_ORIGINS: ${APP_ORIGIN:-http://localhost:8080}
    GOOGLE_FRONTEND_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    GOOGLE_REDIRECT_URI: "${APP_ORIGIN:-http://localhost:8080}/api/auth/google/callback/"
    # Only the restricted host worker protocol; never mount an engine socket.
    CODE_EXECUTION_ENABLED: ${CODE_EXECUTION_ENABLED:-false}
    CODE_RUNNER_TRANSPORT: unix
    CODE_WORKER_DIRECTORY: /run/shared-ide-worker
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128

services:
  redis:
    image: redis:7-alpine
    # Coordination and short-lived presence only; PostgreSQL stores document state.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  backend:
    <<: *backend
    group_add:
      - "${RUNNER_GID:-1000}"
    volumes:
      # Dedicated socket/credential directory; :z retains SELinux enforcement.
      - ./.runtime/runner:/run/shared-ide-worker:ro,z
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_DISABLED: ${VITE_SENTRY_DISABLED:-false}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    restart: unless-stopped

volumes:
  postgres_data:
