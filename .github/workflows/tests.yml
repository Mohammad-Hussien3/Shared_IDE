name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shared_ide_ci
          POSTGRES_USER: shared_ide_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shared_ide_ci -d shared_ide_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-used-for-production-credentials
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: shared_ide_ci
      POSTGRES_USER: shared_ide_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      REDIS_URL: ""
      REDIS_REQUIRED: "false"
      RUN_REDIS_INTEGRATION_TESTS: "0"
      RUN_PODMAN_INTEGRATION_TESTS: "0"
      SENTRY_DSN: ""
      SENTRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply Django migrations
        run: python manage.py migrate --noinput
      - name: Run Django tests
        run: python manage.py test --noinput
      - name: Verify Redis and cross-process collaboration
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
          REDIS_REQUIRED: "true"
          RUN_REDIS_INTEGRATION_TESTS: "1"
        run: python manage.py test workspace.tests.test_redis --noinput

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    env:
      VITE_SENTRY_DSN: ""
      VITE_SENTRY_DISABLED: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Vitest tests
        run: npm test
      - name: Build frontend
        run: npm run build
